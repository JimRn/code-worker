<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Worker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">Code Worker</div>
    <select id="project-picker" title="选择 Project（会话将隔离到该 Project 的仓库）"></select>
    <select id="agent-picker" title="选择 Agent 专家（可选）"><option value="">（默认 Agent）</option></select>
    <select id="repo-picker" title="选择 Repo（可选）"><option value="">（默认 Repo）</option></select>
    <button id="add-repo" type="button" title="添加仓库（空目录或导入已有目录）">+ 仓库</button>
    <button id="new-project" type="button">+ 新 Project</button>
    <button id="new-session">+ 新会话</button>
    <ul id="session-list"></ul>
    <label class="approve"><input type="checkbox" id="approve"> 批准写文件/命令</label>
    <label class="approve"><input type="checkbox" id="per-call"> 逐次审批</label>
    <button id="open-settings" type="button">⚙ 模型设置</button>
    <div id="status" class="status"></div>
    <div id="conn" class="status">● 连接中…</div>
    <div id="model-info" class="status"></div>
    <div id="workspace">
      <div class="ws-head">工作区 <span id="ws-root"></span> <a href="#" id="open-files">打开文件面板 →</a></div>
    </div>
    <div id="todos" hidden>
      <div class="ws-head">任务 <span id="todo-progress"></span></div>
      <ul id="todo-list"></ul>
    </div>
    <div id="usage-info" class="status"></div>
    <div id="settings-panel" hidden>
      <label>Base URL <input id="set-baseurl" placeholder="https://api.openai.com/v1"></label>
      <label>模型 <input id="set-model" placeholder="gpt-4o-mini"></label>
      <label>推理强度 <select id="set-reasoning"><option value="">关闭</option><option value="low">低 low</option><option value="medium">中 medium</option><option value="high">高 high</option></select></label>
      <label>API Key <input id="set-apikey" type="password" autocomplete="new-password" placeholder=""></label>
      <div class="row"><button id="save-settings" type="button">保存</button><button id="test-settings" type="button">测试连接</button></div>
      <div id="settings-status" class="status"></div>
    </div>
  </aside>
  <main id="main">
    <div id="main-head">
      <div id="view-tabs">
        <button type="button" data-view="chat" class="active">对话</button>
        <button type="button" data-view="trace">轨迹</button>
      </div>
      <button id="toggle-files" type="button" title="文件面板">📁 文件</button>
    </div>
    <div id="trace-view" hidden>
      <div class="trace-bar">
        <span class="trace-filters">◷ 时长 · 轮次 · 调用</span>
        <input id="trace-search" placeholder="搜索">
      </div>
      <div id="timeline"></div>
      <div id="trace-list"></div>
    </div>
    <div id="messages"></div>
    <form id="composer">
      <textarea id="input" rows="3" placeholder="发消息或创建任务，/ 调用指令，@ 文件或对话"></textarea>
      <div class="composer-bar">
        <div id="plus-wrap">
          <button type="button" id="plus" title="添加 / 指令">＋</button>
          <div id="plus-menu" hidden>
            <div class="menu-head">添加</div>
            <button type="button" data-act="file">📎 文件 <span>file</span></button>
            <button type="button" data-act="goal">🎯 目标 <span>goal</span><em>设置或查看长期任务目标</em></button>
            <button type="button" data-act="plan">📋 计划 <span>plan</span><em>进入或退出计划模式</em></button>
            <button type="button" data-act="feedback">✈ 反馈 <span>feedback</span><em>发送关于当前会话的反馈</em></button>
            <div class="menu-head">指令</div>
            <button type="button" data-act="compact">○ 压缩 <span>compact</span><em>压缩以上对话内容</em></button>
            <button type="button" data-act="permission">🛡 权限 <span>permission</span><em>切换权限预设</em></button>
            <button type="button" data-act="model">🗄 模型 <span>model</span><em>选择本会话使用的模型</em></button>
            <button type="button" data-act="export">⬇ 下载日志 <span>export</span><em>将当前会话内容导出</em></button>
          </div>
          <input type="file" id="file-input" hidden>
        </div>
        <select id="perm-picker" title="权限模式">
          <option value="full">🛡 完全权限</option>
          <option value="ask">需要审批</option>
          <option value="per-call">逐次审批</option>
        </select>
        <span class="spacer"></span>
        <select id="model-picker" title="选择模型（per-turn）"></select>
        <button type="submit" id="send" title="发送（Enter）">↑</button>
      </div>
    </form>
  </main>
  <aside id="trace-detail" hidden>
    <div class="td-head"><span class="badge tool">工具</span> <span id="td-title"></span><button id="td-close" type="button">✕</button></div>
    <div class="td-tabs"><button data-t="overview" class="active">概述</button><button data-t="args">参数</button><button data-t="result">结果</button><button data-t="schema">Schema</button><button data-t="timing">计时</button></div>
    <div id="td-body"></div>
  </aside>
  <aside id="file-panel" hidden>
    <div class="fp-tab">📁 文件 <button id="fp-close" type="button" title="关闭">✕</button></div>
    <div class="fp-path"><span id="fp-root"></span><button id="fp-refresh" type="button" title="刷新">↻</button></div>
    <ul id="fp-list"></ul>
    <pre id="fp-preview" hidden></pre>
  </aside>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
